name: Quality and Security

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - refactor/cache-performance-v3
      - refactor/frontend-design-system

# A PR revision supersedes older runs. Avoid concurrent browser matrices
# competing for resources and producing stale or timing-sensitive results.
concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Capture clinical visual signature
        if: github.event_name == 'pull_request'
        run: |
          CAPTURE_SIGNATURE=1 PREVIEW_OUTPUT_DIR="${{ runner.temp }}/clinic-signature-preview" \
            npx playwright test --project=chromium \
            --grep 'visual identity: synthetic mobile and desktop screenshot evidence'
      - name: Upload synthetic visual evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: clinic-signature-visual-evidence
          path: ${{ runner.temp }}/clinic-signature-preview
          retention-days: 7
          if-no-files-found: warn
      - run: npm audit --audit-level=moderate

  backend:
    name: Backend security
    runs-on: ubuntu-latest
    env:
      ADMIN_USER: test-admin
      ADMIN_PASSWORD: test-password
      JWT_SECRET: test-only-jwt-secret-that-is-long-enough-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx bandit pip-audit
      - run: python -m py_compile api/index.py core/db_manager.py core/rate_limit.py core/auth.py core/crypto.py
      - run: bandit -q -r api backend core
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: pytest -q tests
