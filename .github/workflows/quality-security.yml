name: Quality and Security

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - refactor/cache-performance-v3

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate

  backend:
    name: Backend security
    runs-on: ubuntu-latest
    env:
      ADMIN_USER: test-admin
      ADMIN_PASSWORD: test-password
      JWT_SECRET: test-only-jwt-secret-that-is-long-enough-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx bandit pip-audit
      - run: python -m py_compile api/index.py core/db_manager.py core/rate_limit.py core/auth.py core/crypto.py
      - run: bandit -q -r api backend core
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: pytest -q tests
